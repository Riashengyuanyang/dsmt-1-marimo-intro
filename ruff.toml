# Ruff's default rules flag two things that marimo writes on purpose: the bare
# `return` at the end of a cell (PLR1711) and a cell's last line, which marimo
# displays (B018). We sort imports with isort, which wraps long imports differently
# from ruff, so ruff's own import sorting check (I001) is switched off too.
[lint]
ignore = ["PLR1711", "B018", "I001"]
